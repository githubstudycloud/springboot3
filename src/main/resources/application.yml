# Spring Boot 数据库监控应用配置
server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: db-monitor
  
  # Jackson配置
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# 数据库监控配置
monitor:
  defaults:
    check-interval: 60
    sql-timeout-threshold: 30
    connection-timeout: 5000
    pool-size: 3
    validation-timeout: 5000
    keep-alive-time: 600000
    query-timeout: 10
  
  datasources:
    - name: "main-db"
      url: "jdbc:mysql://192.168.226.136:3306/mysql?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8"
      username: "root"
      password: "rootpass"
      enabled: true
      check-interval: 30
      tags: [ "production", "main" ]
  
  alert:
    enabled: true
    # 统一报警接口地址
    webhook-url: "http://localhost:8080/api/test/webhook"
    # 三个账号的认证token，每天每个账号最多300次
    accounts:
      info:
        receiver: "info-alerts"
        auth: "info_token_12345"
        daily-limit: 300
      warn:
        receiver: "warn-alerts"
        auth: "warn_token_67890"
        daily-limit: 300
      error:
        receiver: "error-alerts"
        auth: "error_token_abcde"
        daily-limit: 300

# 日志配置
logging:
  level:
    com.example.dbmonitor: DEBUG
    org.springframework.jdbc: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always